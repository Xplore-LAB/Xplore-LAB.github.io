<text x="820" y="321" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#203044">Reject → replan</text>
<text x="36" y="570" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#203044">Evaluation: task success + constraint violations + stale-experience reuse + tool / token cost</text>
<text x="36" y="636" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#203044">Original educational redraw · schematic values only · SVG text and objects remain editable</text>
