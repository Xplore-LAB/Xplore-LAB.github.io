          <rect x="102" y="60" width="86" height="60" rx="6" fill="#dce8f0" stroke="#b0b8c0"/>
          <text x="145" y="86" text-anchor="middle" font-size="9" fill="#24292f">共享 FFN</text>
          <text x="145" y="100" text-anchor="middle" font-size="7.5" fill="#8b949e">全部 token 激活</text>
        </g>
        <!-- 右：Switch -->
        <text x="430" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#24292f" font-weight="bold">Switch FFN（top-1 路由）</text>
        <g>
          <rect x="240" y="50" width="18" height="18" rx="3" fill="#0072B2"/>
          <text x="249" y="44" text-anchor="middle" font-size="8" fill="#57606a">t1</text>
          <rect x="240" y="124" width="18" height="18" rx="3" fill="#E69F00"/>
          <text x="249" y="156" text-anchor="middle" font-size="8" fill="#57606a">t2</text>
          <path d="M258 59 L300 90" stroke="#8b949e" stroke-width="1.1" marker-end="url(#arrp9)"/>
          <path d="M258 133 L300 100" stroke="#8b949e" stroke-width="1.1" marker-end="url(#arrp9)"/>
          <rect x="304" y="84" width="52" height="20" rx="4" fill="#24292f"/>
          <text x="330" y="97.5" text-anchor="middle" font-size="8.5" fill="#fff">Router</text>
          <path d="M356 88 L426 42" stroke="#c6cdd4" stroke-width="0.9" stroke-dasharray="3 2"/>
          <path d="M356 94 L426 76" stroke="#0072B2" stroke-width="1.6" marker-end="url(#arrp9b)"/>
          <path d="M356 100 L426 114" stroke="#c6cdd4" stroke-width="0.9" stroke-dasharray="3 2"/>
          <path d="M356 106 L426 152" stroke="#E69F00" stroke-width="1.6" marker-end="url(#arrp9o)"/>
          <text x="386" y="70" text-anchor="middle" font-size="7.5" fill="#8b949e" font-style="italic">top-1</text>
          <g font-size="8.5" text-anchor="middle">
            <rect x="430" y="30" width="86" height="24" rx="5" fill="#fff" stroke="#b0b8c0" stroke-dasharray="4 3"/>
            <text x="473" y="45" fill="#8b949e">Expert 1</text>
            <rect x="430" y="64" width="86" height="24" rx="5" fill="#0072B2"/>
            <text x="473" y="79" fill="#fff" font-weight="bold">Expert 2 ← t1</text>
            <rect x="430" y="102" width="86" height="24" rx="5" fill="#fff" stroke="#b0b8c0" stroke-dasharray="4 3"/>
            <text x="473" y="117" fill="#8b949e">Expert 3</text>
            <rect x="430" y="140" width="86" height="24" rx="5" fill="#E69F00"/>
            <text x="473" y="155" fill="#fff" font-weight="bold">Expert 4 ← t2</text>
          </g>
        </g>
        <text x="560" y="102" text-anchor="middle" font-size="7.5" fill="#8b949e">加权输出</text>
        <text x="316" y="182" text-anchor="middle" font-size="9.5" fill="#8b949e">未选中路径保留灰虚线：读者能自行确认「还有别的路」，比只画被选路径更诚实</text>
      </svg>