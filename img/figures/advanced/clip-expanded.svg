<svg xmlns="http://www.w3.org/2000/svg" width="182mm" height="100mm" viewBox="0 0 1200 660" role="img">
<title>CLIP: align paired images and text in a shared space</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526174"/></marker></defs><rect width="1200" height="660" fill="white"/>
<text x="36" y="42" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#203044">CLIP: align paired images and text in a shared space</text>
<text x="36" y="73" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#203044">Symmetric contrastive training over a minibatch of N image–text pairs (Radford et al., 2021).</text>
<g><rect x="40" y="140" width="280" height="135" rx="10" fill="#0072B2" fill-opacity=".07" stroke="#0072B2" stroke-width="1.5"/>
<text x="56" y="170" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#203044">Image encoder</text>
<text x="56" y="201" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Image batch → features</text>
<text x="56" y="228" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Normalize: v / ||v||</text>
</g>
<g><rect x="40" y="365" width="280" height="135" rx="10" fill="#009E73" fill-opacity=".07" stroke="#009E73" stroke-width="1.5"/>
<text x="56" y="395" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#203044">Text encoder</text>
<text x="56" y="426" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Tokenized captions</text>
<text x="56" y="453" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Normalize: t / ||t||</text>
</g>
<g><rect x="410" y="200" width="300" height="245" rx="10" fill="#8064A2" fill-opacity=".07" stroke="#8064A2" stroke-width="1.5"/>
<text x="426" y="230" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#203044">Pairwise similarities</text>
<text x="426" y="261" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">S[i,j] = exp(a) · v_iᵀ t_j</text>
<text x="426" y="288" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Learned logit scale a</text>
<text x="426" y="315" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Diagonal = matched pairs</text>
<text x="426" y="342" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Off-diagonal = negatives</text>
</g>
