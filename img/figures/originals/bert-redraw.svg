<svg viewBox="0 0 632 190" role="img" aria-label="BERT 预训练与微调双联图示意">
        <g font-family="Georgia, serif" font-size="12" fill="#24292f" text-anchor="middle">
          <text x="160" y="28">Pre-Training</text>
          <text x="472" y="28">Fine-Tuning</text>
        </g>
        <line x1="316" y1="16" x2="316" y2="162" stroke="#e5e9ee" stroke-width="1" stroke-dasharray="4 3"/>
        <!-- 左：预训练 -->
        <g text-anchor="middle" font-size="8.5">
          <rect x="100" y="44" width="120" height="20" rx="4" fill="#0072B2"/>
          <text x="160" y="58" fill="#fff">[CLS] 句对分类头</text>
          <g fill="#dceaf5" stroke="#0072B2" stroke-width="0.8">
            <rect x="90" y="76" width="140" height="14" rx="2"/>
            <rect x="90" y="94" width="140" height="14" rx="2"/>
            <rect x="90" y="112" width="140" height="14" rx="2"/>
          </g>
          <g font-size="8" fill="#24292f">
            <text x="160" y="86">Trm</text><text x="160" y="104">Trm</text><text x="160" y="122">Trm</text>
          </g>
          <g stroke="#b0b8c0" stroke-width="0.8" fill="#fff">
            <rect x="86" y="140" width="26" height="16" rx="2"/>
            <rect x="118" y="140" width="26" height="16" rx="2" fill="#E69F00" stroke="#E69F00"/>
            <rect x="150" y="140" width="26" height="16" rx="2"/>
            <rect x="182" y="140" width="26" height="16" rx="2"/>
            <rect x="214" y="140" width="26" height="16" rx="2"/>
          </g>
          <text x="131" y="151" font-size="7.5" fill="#fff">[MASK]</text>
        </g>
        <!-- 右：微调 -->
        <g text-anchor="middle" font-size="8.5">
          <rect x="412" y="44" width="120" height="20" rx="4" fill="#009E73"/>
          <text x="472" y="58" fill="#fff">任务头（问答/NER…）</text>
          <g fill="#dceaf5" stroke="#0072B2" stroke-width="0.8">
            <rect x="402" y="76" width="140" height="14" rx="2"/>
            <rect x="402" y="94" width="140" height="14" rx="2"/>
            <rect x="402" y="112" width="140" height="14" rx="2"/>
          </g>
          <g font-size="8" fill="#24292f">
            <text x="472" y="86">Trm</text><text x="472" y="104">Trm</text><text x="472" y="122">Trm</text>
          </g>
          <g stroke="#b0b8c0" stroke-width="0.8" fill="#fff">
            <rect x="398" y="140" width="26" height="16" rx="2"/>
            <rect x="430" y="140" width="26" height="16" rx="2"/>
            <rect x="462" y="140" width="26" height="16" rx="2"/>
            <rect x="494" y="140" width="26" height="16" rx="2"/>
            <rect x="526" y="140" width="26" height="16" rx="2"/>
          </g>
        </g>
        <text x="316" y="180" text-anchor="middle" font-size="9.5" fill="#8b949e">两子图共享同一套 Trm 图元与坐标系，唯一差异在顶部任务头</text>
      </svg>