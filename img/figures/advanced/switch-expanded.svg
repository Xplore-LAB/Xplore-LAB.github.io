<text x="95" y="295" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#203044">Experts 1 / 2 / 3</text>
<text x="35" y="495" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#203044">Rows: five illustrative tokens</text>
<g><rect x="385" y="130" width="285" height="130" rx="10" fill="#8064A2" fill-opacity=".07" stroke="#8064A2" stroke-width="1.5"/>
<text x="401" y="160" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#203044">Top-1 dispatch</text>
<text x="401" y="191" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">e(t) = argmax p(e | t)</text>
<text x="401" y="218" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#203044">Capacity limits per expert</text>
</g>
