<svg viewBox="0 0 632 200" role="img" aria-label="CLIP 双流对比学习示意">
        <defs>
          <marker id="arr3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/>
          </marker>
        </defs>
        <!-- 图像流 -->
        <g>
          <g fill="#dceaf5" stroke="#0072B2" stroke-width="0.8">
            <rect x="20" y="26" width="38" height="38" rx="3"/>
            <rect x="66" y="26" width="38" height="38" rx="3"/>
            <rect x="112" y="26" width="38" height="38" rx="3"/>
          </g>
          <circle cx="39" cy="45" r="8" fill="#0072B2" opacity="0.5"/>
          <path d="M70,58 L82,40 L92,50 L104,36" stroke="#0072B2" stroke-width="1.5" fill="none"/>
          <rect x="122" y="36" width="18" height="12" fill="#009E73" opacity="0.6"/>
          <line x1="150" y1="45" x2="176" y2="45" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr3)"/>
          <rect x="180" y="32" width="110" height="26" rx="5" fill="#0072B2"/>
          <text x="235" y="49" text-anchor="middle" font-size="9.5" fill="#fff">Image Encoder</text>
          <line x1="290" y1="45" x2="316" y2="45" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr3)"/>
          <g font-size="8" text-anchor="middle">
            <rect x="320" y="34" width="26" height="20" rx="2" fill="#dceaf5" stroke="#0072B2" stroke-width="0.8"/>
            <text x="333" y="47" fill="#24292f">I1</text>
            <rect x="352" y="34" width="26" height="20" rx="2" fill="#dceaf5" stroke="#0072B2" stroke-width="0.8"/>
            <text x="365" y="47" fill="#24292f">I2</text>
            <rect x="384" y="34" width="26" height="20" rx="2" fill="#dceaf5" stroke="#0072B2" stroke-width="0.8"/>
            <text x="397" y="47" fill="#24292f">I3</text>
          </g>
        </g>
        <!-- 文本流 -->
        <g>
          <g fill="#fdf3e3" stroke="#E69F00" stroke-width="0.8">
            <rect x="20" y="140" width="40" height="18" rx="9"/>
            <rect x="68" y="140" width="40" height="18" rx="9"/>
            <rect x="116" y="140" width="40" height="18" rx="9"/>
          </g>
          <g font-size="7.5" fill="#8b949e" text-anchor="middle">
            <text x="40" y="152">a dog</text><text x="88" y="152">a cat</text><text x="136" y="152">a car</text>
          </g>
          <line x1="158" y1="149" x2="176" y2="149" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr3)"/>
          <rect x="180" y="136" width="110" height="26" rx="5" fill="#E69F00"/>
          <text x="235" y="153" text-anchor="middle" font-size="9.5" fill="#fff">Text Encoder</text>
          <line x1="290" y1="149" x2="316" y2="149" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr3)"/>
          <g font-size="8" text-anchor="middle">
            <rect x="320" y="140" width="26" height="20" rx="2" fill="#fdf3e3" stroke="#E69F00" stroke-width="0.8"/>
            <text x="333" y="153" fill="#24292f">T1</text>
            <rect x="352" y="140" width="26" height="20" rx="2" fill="#fdf3e3" stroke="#E69F00" stroke-width="0.8"/>
            <text x="365" y="153" fill="#24292f">T2</text>
            <rect x="384" y="140" width="26" height="20" rx="2" fill="#fdf3e3" stroke="#E69F00" stroke-width="0.8"/>
            <text x="397" y="153" fill="#24292f">T3</text>
          </g>
        </g>
        <!-- 汇聚虚线 -->
        <line x1="410" y1="44" x2="462" y2="70" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 2"/>
        <line x1="410" y1="150" x2="462" y2="130" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 2"/>
        <!-- 相似度矩阵 -->
        <g stroke="#ffffff" stroke-width="1.5">
          <rect x="466" y="46" width="36" height="36" fill="#0072B2" opacity="0.9"/>
          <rect x="502" y="46" width="36" height="36" fill="#dfe7ee"/>
          <rect x="538" y="46" width="36" height="36" fill="#eef1f4"/>
          <rect x="466" y="82" width="36" height="36" fill="#eef1f4"/>
          <rect x="502" y="82" width="36" height="36" fill="#0072B2" opacity="0.9"/>
          <rect x="538" y="82" width="36" height="36" fill="#dfe7ee"/>
          <rect x="466" y="118" width="36" height="36" fill="#dfe7ee"/>
          <rect x="502" y="118" width="36" height="36" fill="#eef1f4"/>
          <rect x="538" y="118" width="36" height="36" fill="#0072B2" opacity="0.9"/>
        </g>
        <text x="520" y="176" text-anchor="middle" font-size="9" fill="#8b949e">N×N 相似度矩阵，对角线为正样本对</text>
      </svg>