<svg viewBox="0 0 632 190" role="img" aria-label="Switch Transformer 路由分流示意">
        <defs>
          <marker id="arrp9" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/>
          </marker>
          <marker id="arrp9b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#0072B2"/>
          </marker>
          <marker id="arrp9o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#E69F00"/>
          </marker>
        </defs>
        <!-- 左：Dense -->
        <text x="100" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#24292f" font-weight="bold">Dense FFN</text>
        <g>
          <rect x="58" y="52" width="18" height="18" rx="3" fill="#0072B2"/>
          <text x="67" y="82" text-anchor="middle" font-size="8" fill="#57606a">t1</text>
          <rect x="58" y="110" width="18" height="18" rx="3" fill="#E69F00"/>
          <text x="67" y="140" text-anchor="middle" font-size="8" fill="#57606a">t2</text>
          <path d="M76 61 L98 74" stroke="#8b949e" stroke-width="1.1" marker-end="url(#arrp9)"/>
