<svg viewBox="0 0 632 160" role="img" aria-label="DDPM 前向反向链示意">
        <defs>
          <marker id="arr4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/>
          </marker>
          <marker id="arr4b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#0072B2"/>
          </marker>
        </defs>
        <!-- 前向箭头（上排，向右） -->
        <g stroke="#8b949e" stroke-width="1.2" fill="none">
          <path d="M104,52 Q145,36 186,52" marker-end="url(#arr4)"/>
          <path d="M214,52 Q255,36 296,52" marker-end="url(#arr4)"/>
          <path d="M324,52 Q365,36 406,52" marker-end="url(#arr4)"/>
          <path d="M434,52 Q475,36 516,52" marker-end="url(#arr4)"/>
        </g>
        <text x="310" y="24" text-anchor="middle" font-size="9.5" fill="#57606a" font-style="italic">q：前向逐步加噪</text>
        <!-- 反向箭头（下排，向左，虚线） -->
        <g stroke="#0072B2" stroke-width="1.2" fill="none" stroke-dasharray="4 2.5">
          <path d="M186,98 Q145,114 104,98" marker-end="url(#arr4b)"/>
          <path d="M296,98 Q255,114 214,98" marker-end="url(#arr4b)"/>
          <path d="M406,98 Q365,114 324,98" marker-end="url(#arr4b)"/>
          <path d="M516,98 Q475,114 434,98" marker-end="url(#arr4b)"/>
        </g>
        <text x="310" y="132" text-anchor="middle" font-size="9.5" fill="#0072B2" font-style="italic">p_θ：反向逐步去噪（可学习）</text>
        <!-- 链式节点：填充渐变演出加噪过程 -->
        <g font-size="9.5" text-anchor="middle">
          <rect x="76" y="58" width="28" height="28" rx="4" fill="#0072B2"/>
          <text x="90" y="100" fill="#24292f">x₀</text>
          <rect x="186" y="58" width="28" height="28" rx="4" fill="#4a90c4"/>
          <text x="200" y="100" fill="#24292f">x₁</text>
          <rect x="296" y="58" width="28" height="28" rx="4" fill="#8ab0cf"/>
          <text x="310" y="100" fill="#24292f">x₂</text>
          <rect x="406" y="58" width="28" height="28" rx="4" fill="#c0ccd8"/>
          <text x="420" y="100" fill="#24292f">x₃</text>
          <rect x="516" y="58" width="28" height="28" rx="4" fill="#e8ebee" stroke="#b0b8c0" stroke-width="0.8"/>
          <text x="530" y="100" fill="#24292f">x_T</text>
        </g>
        <text x="530" y="48" text-anchor="middle" font-size="8.5" fill="#8b949e">纯噪声</text>
        <text x="90" y="48" text-anchor="middle" font-size="8.5" fill="#8b949e">原图</text>
      </svg>