name: Translate blog posts

on:
  push:
    branches: [master]
    paths:
      - '_posts/**'
      - 'scripts/translate_blog.py'
      - '.github/workflows/blog-translation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: blog-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Generate English versions of new and edited posts
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/translate_blog.py
      - name: Publish translations and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- _data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update English blog translations'
          git pull --rebase origin master
          git push origin HEAD:master
          gh workflow run pages.yml --ref master
